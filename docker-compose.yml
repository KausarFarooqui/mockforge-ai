version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./renders:/app/renders
      - ./blender_templates:/app/blender_templates
    environment:
      - BLENDER_PATH=/usr/bin/blender
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - RENDER_TIMEOUT=120
      - RENDER_SAMPLES=128
      - RENDER_RESOLUTION=2048
      - CACHE_ENABLED=true
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve

volumes:
  ollama_data:
